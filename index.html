<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11월 모집글 시안</title>
<style>
  :root{--bg:#fbf6ee;--card:#fff;--ink:#3b2a20;--sub:#8a7566;--line:#eadfce;--accent:#c4501b}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1814;--card:#262019;--ink:#f1e8dc;--sub:#b3a291;--line:#3a3028;--accent:#f08a4b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;padding:40px 16px 80px}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:var(--sub);margin:0 0 28px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  a.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  a.card div{padding:14px 16px}
  a.card b{display:block;font-size:16px}
  a.card span{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <h1>11월 빛소영 아웃풋 스쿨 모집글 시안</h1>
  <p class="sub">같은 글에 이미지 톤만 다른 두 가지 버전이에요. 눌러서 확인하세요.</p>
  <div class="grid">
    <a class="card" href="nov_warm.html"><img src="img/warm/01-thumb.webp" alt="웜톤 썸네일"><div><b>웜톤 버전</b><span>노을빛 복숭아·연보라</span></div></a>
    <a class="card" href="nov_blue.html"><img src="img/blue/01-thumb.webp" alt="남색 썸네일"><div><b>남색 버전</b><span>첫서리 내린 남색 밤</span></div></a>
  </div>
</div>
</body>
</html>
